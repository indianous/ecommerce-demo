version: 2
registries:
  # base-ds vem do GitHub Packages, que exige token até para ler. GH_PACKAGES_TOKEN é
  # um segredo do Dependabot (não de Actions) com um PAT classic com read:packages.
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.GH_PACKAGES_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /
    registries: [github-packages]
    schedule:
      interval: weekly
    # Por enquanto só o base-ds. Ele é instalado pelo nome com escopo: com o alias
    # "base-ds": "npm:@indianous/base-ds@...", o Dependabot procurava o pacote pelo
    # nome do alias e falhava (indianous/base-ds#44, ecommerce-frontend#24).
    allow:
      - dependency-name: '@indianous/base-ds'
