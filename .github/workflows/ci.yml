name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Type Check, Test & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: read # baixar o @indianous/base-ds do GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@indianous'

      # base-ds vem do GitHub Packages (@indianous/base-ds), que exige token
      # mesmo para instalar — o .npmrc lê GITHUB_PACKAGES_TOKEN. O GITHUB_TOKEN
      # do run basta: o pacote dá acesso de leitura a este repositório
      # (Package settings → Manage Actions access).
      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }} # lido pelo .npmrc do projeto
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # lido pelo .npmrc do setup-node

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage
          retention-days: 7

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
